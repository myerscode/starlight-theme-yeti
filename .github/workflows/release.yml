name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0)'
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate version format
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be in SemVer format MAJOR.MINOR.PATCH (e.g. 0.2.0)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm CLI 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@latest

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Authenticates via OIDC trusted publishing — no npm token needed
      - name: Publish to NPM
        run: npm publish --provenance --access public

      # Commits via the GitHub API are signed by GitHub and show as Verified.
      # Runs only after a successful publish, so failed runs leave nothing to clean up.
      - name: Commit version bump
        id: bump
        uses: planetscale/ghcommit-action@v0.2.22
        with:
          commit_message: "chore: release ${{ steps.version.outputs.tag }}"
          repo: ${{ github.repository }}
          branch: main
          file_pattern: package.json
        env:
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      # Tag the release commit so the tagged tree matches what was published to npm.
      # The local tag (at the checked-out HEAD) exists only for changelog generation;
      # its range differs from the remote tag by just the chore commit, which is excluded.
      - name: Create tag
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.bump.outputs.commit-hash }}
        run: |
          git tag "$TAG"
          # If no bump commit was needed (version already on main), tag HEAD instead
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${SHA:-$(git rev-parse HEAD)}"

      - name: Get previous tag
        id: previous
        env:
          CURRENT: ${{ steps.version.outputs.tag }}
        run: |
          PREVIOUS=$(git tag --list --sort=-version:refname '[0-9]*' | grep -v "^${CURRENT}$" | head -1)
          if [ -n "$PREVIOUS" ]; then
            echo "tag=$PREVIOUS" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        if: steps.previous.outputs.found == 'true'
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          fromTag: ${{ steps.version.outputs.tag }}
          toTag: ${{ steps.previous.outputs.tag }}
          excludeTypes: build,docs,other,style,ci,chore
          useGitmojis: false
          writeToFile: false

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.changes || 'Initial release' }}
